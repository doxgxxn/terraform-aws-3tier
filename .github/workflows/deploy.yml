# Apply on merge to main: dev first, then prod behind a protected environment
# (configure a required reviewer on the `prod` environment for a manual gate).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  apply-dev:
    name: apply (dev)
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v4

      - name: terraform init
        run: >
          terraform -chdir=envs/dev init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform apply
        run: terraform -chdir=envs/dev apply -input=false -auto-approve

  apply-prod:
    name: apply (prod)
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v4

      - name: terraform init
        run: >
          terraform -chdir=envs/prod init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform apply
        run: terraform -chdir=envs/prod apply -input=false -auto-approve
